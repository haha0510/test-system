{% extends "admin/base_admin.html" %}

{% block title %}舆情采集{% endblock %}

{% block extra_css %}
<style>
    .search-box {
        background: #fff;
        padding: 20px;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    .news-list {
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .news-item {
        display: flex;
        padding: 20px;
        border-bottom: 1px solid #f0f0f0;
        transition: all 0.3s ease;
    }
    .news-item:hover {
        background: #f9f9f9;
    }
    .news-item:last-child {
        border-bottom: none;
    }
    .news-cover {
        width: 160px;
        height: 100px;
        border-radius: 4px;
        overflow: hidden;
        flex-shrink: 0;
        margin-right: 20px;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .news-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .news-cover .no-img {
        color: #ccc;
        font-size: 36px;
    }
    .news-content {
        flex: 1;
        min-width: 0;
    }
    .news-title {
        font-size: 16px;
        font-weight: 500;
        color: #333;
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .news-title a {
        color: #333;
        text-decoration: none;
    }
    .news-title a:hover {
        color: #1e3c72;
    }
    .news-summary {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .news-meta {
        font-size: 12px;
        color: #999;
    }
    .news-meta span {
        margin-right: 15px;
    }
    .news-meta i {
        margin-right: 4px;
    }
    .loading-box {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }
    .loading-box i {
        font-size: 48px;
        margin-bottom: 15px;
        display: block;
    }
    .empty-box {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }
    .empty-box i {
        font-size: 64px;
        margin-bottom: 15px;
        display: block;
        color: #ddd;
    }
    .stats-bar {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        background: #f8f9fa;
        border-bottom: 1px solid #f0f0f0;
    }
    .stats-bar .total {
        color: #666;
    }
    .stats-bar .total strong {
        color: #1e3c72;
        font-size: 18px;
    }
</style>
{% endblock %}

{% block content %}
<!-- 搜索框 -->
<div class="search-box">
    <div class="layui-form">
        <div class="layui-inline" style="width: 300px;">
            <input type="text" id="keyword" placeholder="请输入搜索关键字" class="layui-input">
        </div>
        <div class="layui-inline" style="width: 120px;">
            <select id="count">
                <option value="10">10条</option>
                <option value="20">20条</option>
                <option value="30" selected>30条</option>
                <option value="50">50条</option>
            </select>
        </div>
        <div class="layui-inline">
            <button class="layui-btn" id="searchBtn">
                <i class="layui-icon layui-icon-search"></i> 搜索采集
            </button>
        </div>
    </div>
</div>

<!-- 新闻列表 -->
<div class="news-list" id="newsList">
    <div class="empty-box">
        <i class="layui-icon layui-icon-search"></i>
        <p>输入关键字开始采集舆情数据</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
layui.use(['form', 'layer'], function(){
    var layer = layui.layer;
    var form = layui.form;
    var $ = layui.$;

    var isLoading = false;

    // 搜索按钮点击
    $('#searchBtn').click(function(){
        doSearch();
    });

    // 回车搜索
    $('#keyword').keydown(function(e){
        if(e.keyCode === 13){
            doSearch();
        }
    });

    function doSearch(){
        var keyword = $('#keyword').val().trim();
        var count = $('#count').val();

        if(!keyword){
            layer.msg('请输入搜索关键字', {icon: 0});
            return;
        }

        if(isLoading) return;
        isLoading = true;

        // 显示加载中
        $('#newsList').html(
            '<div class="loading-box">' +
            '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>' +
            '<p>正在采集舆情数据，请稍候...</p>' +
            '</div>'
        );

        // 请求API
        fetch('/api/news/search?keyword=' + encodeURIComponent(keyword) + '&count=' + count)
            .then(function(res){ return res.json(); })
            .then(function(res){
                isLoading = false;
                if(res.code === 0){
                    renderNewsList(res.data, keyword);
                } else {
                    layer.msg(res.msg || '采集失败', {icon: 2});
                    $('#newsList').html(
                        '<div class="empty-box">' +
                        '<i class="layui-icon layui-icon-face-cry"></i>' +
                        '<p>采集失败，请稍后重试</p>' +
                        '</div>'
                    );
                }
            })
            .catch(function(err){
                isLoading = false;
                layer.msg('网络错误', {icon: 2});
                $('#newsList').html(
                    '<div class="empty-box">' +
                    '<i class="layui-icon layui-icon-face-cry"></i>' +
                    '<p>网络错误，请检查网络连接</p>' +
                    '</div>'
                );
            });
    }

    function renderNewsList(data, keyword){
        if(!data || data.length === 0){
            $('#newsList').html(
                '<div class="empty-box">' +
                '<i class="layui-icon layui-icon-file"></i>' +
                '<p>未找到相关舆情数据</p>' +
                '</div>'
            );
            return;
        }

        var html = '<div class="stats-bar"><span class="total">关键字 <strong>"' + escapeHtml(keyword) + '"</strong> 共采集到 <strong>' + data.length + '</strong> 条舆情数据</span></div>';

        data.forEach(function(item, index){
            var coverHtml = item.cover
                ? '<img src="' + escapeHtml(item.cover) + '" onerror="this.parentNode.innerHTML=\'<i class=\\\'layui-icon layui-icon-picture no-img\\\'></i>\'">'
                : '<i class="layui-icon layui-icon-picture no-img"></i>';

            html += '<div class="news-item">' +
                '<div class="news-cover">' + coverHtml + '</div>' +
                '<div class="news-content">' +
                    '<div class="news-title"><a href="' + escapeHtml(item.url) + '" target="_blank">' + escapeHtml(item.title) + '</a></div>' +
                    '<div class="news-summary">' + escapeHtml(item.summary || '暂无摘要') + '</div>' +
                    '<div class="news-meta">' +
                        '<span><i class="layui-icon layui-icon-website"></i>' + escapeHtml(item.source || '未知来源') + '</span>' +
                        '<span><i class="layui-icon layui-icon-link"></i><a href="' + escapeHtml(item.url) + '" target="_blank" style="color:#999;">查看原文</a></span>' +
                    '</div>' +
                '</div>' +
            '</div>';
        });

        $('#newsList').html(html);
    }

    function escapeHtml(str){
        if(!str) return '';
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;');
    }
});
</script>
{% endblock %}
