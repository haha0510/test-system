<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}后台管理{% endblock %} - 政企智能舆情分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layui-v2.13.2/layui/css/layui.css') }}">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #f0f2f5;
        }
        /* 顶部导航 */
        .admin-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .admin-header::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00f2ff, #4facfe, #00f2ff);
            background-size: 200% 100%;
            animation: gradientFlow 3s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .admin-header .logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .admin-header .logo i {
            font-size: 32px;
            margin-right: 12px;
            color: #00f2ff;
            text-shadow: 0 0 20px rgba(0,242,255,0.5);
            animation: iconPulse 2s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .admin-header .logo span {
            background: linear-gradient(90deg, #fff, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-header .user-info {
            display: flex;
            align-items: center;
            color: #fff;
        }
        .admin-header .user-info > span {
            margin-right: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .admin-header .user-info > span:hover {
            background: rgba(255,255,255,0.15);
        }
        .admin-header .user-info > span i {
            margin-right: 6px;
            color: #00f2ff;
        }
        .admin-header .user-info .layui-btn {
            background: linear-gradient(135deg, #00f2ff 0%, #4facfe 100%);
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,242,255,0.3);
        }
        .admin-header .user-info .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,242,255,0.4);
        }
        /* 侧边栏 */
        .admin-side {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 220px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
        }
        .admin-side::-webkit-scrollbar {
            width: 6px;
        }
        .admin-side::-webkit-scrollbar-thumb {
            background: rgba(0,242,255,0.3);
            border-radius: 3px;
        }
        .admin-side .side-title {
            padding: 20px 24px 12px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .admin-side .layui-nav {
            background: transparent;
            padding: 10px 0;
        }
        .admin-side .layui-nav .layui-nav-item {
            margin: 4px 12px;
        }
        .admin-side .layui-nav .layui-nav-item a {
            color: rgba(255,255,255,0.7);
            padding: 0 20px;
            height: 50px;
            line-height: 50px;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .admin-side .layui-nav .layui-nav-item a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 0;
            background: linear-gradient(180deg, #00f2ff, #4facfe);
            border-radius: 0 4px 4px 0;
            transition: height 0.3s ease;
        }
        .admin-side .layui-nav .layui-nav-item a:hover {
            background: rgba(0,242,255,0.1);
            color: #fff;
            transform: translateX(4px);
        }
        .admin-side .layui-nav .layui-nav-item a:hover::before {
            height: 24px;
        }
        .admin-side .layui-nav .layui-this a {
            background: linear-gradient(90deg, rgba(0,242,255,0.2), rgba(79,172,254,0.1));
            color: #00f2ff;
            font-weight: 500;
        }
        .admin-side .layui-nav .layui-this a::before {
            height: 24px;
        }
        .admin-side .layui-nav .layui-nav-item a i {
            margin-right: 12px;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .admin-side .layui-nav .layui-nav-item a:hover i {
            color: #00f2ff;
            transform: scale(1.1);
        }
        .admin-side .layui-nav .layui-this a i {
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
        .admin-side .layui-nav-bar {
            display: none;
        }
        /* 主体内容 */
        .admin-body {
            margin-left: 220px;
            padding: 24px;
            min-height: calc(100vh - 60px);
            margin-top: 60px;
            background: #f0f2f5;
        }
        .admin-body .layui-card {
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: none;
            overflow: hidden;
        }
        .admin-body .layui-card-header {
            font-weight: 600;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px;
            padding: 16px 20px;
            background: #fff;
        }
        /* 数据卡片 */
        .data-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 24px;
            color: #fff;
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .data-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transition: all 0.4s ease;
        }
        .data-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .data-card:hover::before {
            transform: scale(1.5);
        }
        .data-card.blue { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); }
        .data-card.cyan { background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%); }
        .data-card.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .data-card.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .data-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .data-card .num {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 顶部导航 -->
    <div class="admin-header">
        <div class="logo">
            <i class="layui-icon layui-icon-app"></i>
            <span>政企智能舆情分析系统</span>
        </div>
        <div class="user-info">
            <span><i class="layui-icon layui-icon-username"></i> {{ session.username }}</span>
            <button class="layui-btn layui-btn-sm" id="logoutBtn">
                <i class="layui-icon layui-icon-logout"></i> 退出
            </button>
        </div>
    </div>

    <!-- 侧边导航 -->
    <div class="admin-side">
        <ul class="layui-nav layui-nav-tree">
            <li class="layui-nav-item {% if request.endpoint == 'main.dashboard' %}layui-this{% endif %}">
                <a href="{{ url_for('main.dashboard') }}"><i class="layui-icon layui-icon-home"></i>仪表盘</a>
            </li>
            <li class="layui-nav-item {% if request.endpoint == 'main.data_collect' %}layui-this{% endif %}">
                <a href="{{ url_for('main.data_collect') }}"><i class="layui-icon layui-icon-download-circle"></i>数据采集</a>
            </li>
            <li class="layui-nav-item {% if request.endpoint == 'main.data_warehouse' %}layui-this{% endif %}">
                <a href="{{ url_for('main.data_warehouse') }}"><i class="layui-icon layui-icon-template-1"></i>数据仓库</a>
            </li>
            {% if session.role == 'admin' %}
            <li class="layui-nav-item {% if request.endpoint == 'main.user_manage' %}layui-this{% endif %}">
                <a href="{{ url_for('main.user_manage') }}"><i class="layui-icon layui-icon-user"></i>用户管理</a>
            </li>
            <li class="layui-nav-item {% if request.endpoint == 'main.system_settings' %}layui-this{% endif %}">
                <a href="{{ url_for('main.system_settings') }}"><i class="layui-icon layui-icon-set"></i>系统设置</a>
            </li>
            {% endif %}
        </ul>
    </div>

    <!-- 主体内容 -->
    <div class="admin-body">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='layui-v2.13.2/layui/layui.js') }}"></script>
    <script>
        layui.use(['element', 'layer'], function(){
            var layer = layui.layer;

            // 退出登录
            document.getElementById('logoutBtn').onclick = function(){
                layer.confirm('确定要退出登录吗？', {icon: 3, title: '提示'}, function(index){
                    fetch('/api/auth/logout', { method: 'POST' })
                        .then(res => res.json())
                        .then(data => {
                            if(data.code === 0) {
                                window.location.href = '/login';
                            }
                        });
                    layer.close(index);
                });
            };
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
