{% extends "admin/base_admin.html" %}

{% block title %}数据采集管理{% endblock %}

{% block extra_css %}
<style>
    .collect-header {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .collect-form {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
    }
    .collect-form .layui-input {
        width: 300px;
        border-radius: 8px;
        height: 42px;
    }
    .collect-form .layui-select {
        width: 120px;
    }
    .collect-form .layui-btn {
        height: 42px;
        border-radius: 8px;
        padding: 0 24px;
    }
    .btn-collect {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
    }
    .btn-save-batch {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        border: none;
    }

    /* 进度条 */
    .progress-wrap {
        display: none;
        margin-top: 16px;
        padding: 16px;
        background: #f8f9fa;
        border-radius: 8px;
    }
    .progress-wrap.show {
        display: block;
    }
    .progress-bar {
        height: 8px;
        background: #e9ecef;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 8px;
    }
    .progress-bar .progress-inner {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 4px;
        transition: width 0.3s ease;
        animation: progressPulse 1.5s ease-in-out infinite;
    }
    @keyframes progressPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    .progress-text {
        font-size: 13px;
        color: #666;
    }

    /* 统计信息 */
    .stats-bar {
        display: flex;
        gap: 20px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #eee;
    }
    .stats-item {
        font-size: 14px;
        color: #666;
    }
    .stats-item strong {
        color: #333;
        font-size: 18px;
        margin-right: 4px;
    }

    /* 新闻卡片网格 */
    .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
    }
    .news-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        transition: all 0.3s ease;
        position: relative;
    }
    .news-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .news-card.selected {
        border: 2px solid #667eea;
    }
    .news-card .card-checkbox {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
    }
    .news-card .card-checkbox input {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }
    .news-card .card-cover {
        width: 100%;
        height: 180px;
        object-fit: cover;
        cursor: pointer;
        transition: transform 0.3s ease;
    }
    .news-card:hover .card-cover {
        transform: scale(1.02);
    }
    .news-card .card-body {
        padding: 16px;
    }
    .news-card .card-title {
        font-size: 15px;
        font-weight: 600;
        color: #333;
        line-height: 1.5;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .news-card .card-source {
        font-size: 12px;
        color: #999;
        margin-bottom: 12px;
    }
    .news-card .card-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .news-card .btn-deep {
        flex: 1;
        height: 32px;
        line-height: 32px;
        font-size: 12px;
        border-radius: 6px;
    }
    .news-card .btn-deep.collected {
        background: #e8f5e9;
        color: #4caf50;
        border-color: #4caf50;
    }
    .news-card .btn-save {
        height: 32px;
        line-height: 32px;
        font-size: 12px;
        border-radius: 6px;
    }
    .news-card .deep-status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
    }
    .deep-status.done {
        background: #e8f5e9;
        color: #4caf50;
    }
    .deep-status.pending {
        background: #fff3e0;
        color: #ff9800;
    }

    /* 空状态 */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }
    .empty-state i {
        font-size: 64px;
        margin-bottom: 16px;
        opacity: 0.5;
    }

    /* 全选框 */
    .select-all-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
    }
    .select-all-wrap label {
        cursor: pointer;
        user-select: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="layui-card">
    <div class="layui-card-header">
        <i class="layui-icon layui-icon-download-circle" style="margin-right: 8px;"></i>数据采集管理
    </div>
    <div class="layui-card-body">
        <!-- 采集表单 -->
        <div class="collect-header">
            <div class="collect-form">
                <input type="text" id="keyword" class="layui-input" placeholder="请输入采集关键词或需求...">
                <select id="source" class="layui-input" style="width: 140px; height: 42px;">
                    <option value="">加载中...</option>
                </select>
                <input type="number" id="count" class="layui-input" value="30" min="1" max="200" placeholder="条数" style="width: 100px; height: 42px; text-align: center;">
                <button class="layui-btn btn-collect" id="btnCollect">
                    <i class="layui-icon layui-icon-search"></i> 开始搜索
                </button>
                <button class="layui-btn btn-save-batch" id="btnSaveBatch" style="display: none;">
                    <i class="layui-icon layui-icon-ok"></i> 保存采集
                </button>
            </div>

            <!-- 进度条 -->
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar">
                    <div class="progress-inner" id="progressInner" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">正在采集数据...</div>
            </div>

            <!-- 统计信息 -->
            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stats-item">
                    <strong id="totalCount">0</strong>条数据
                </div>
                <div class="stats-item">
                    <strong id="selectedCount">0</strong>条已选
                </div>
                <div class="stats-item">
                    <strong id="deepCount">0</strong>条已深度采集
                </div>
            </div>
        </div>

        <!-- 全选 -->
        <div class="select-all-wrap" id="selectAllWrap" style="display: none;">
            <input type="checkbox" id="selectAll">
            <label for="selectAll">全选 / 取消全选</label>
        </div>

        <!-- 数据列表 -->
        <div id="newsList">
            <div class="empty-state">
                <i class="layui-icon layui-icon-search"></i>
                <p>请输入关键词开始搜索数据</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
layui.use(['layer', 'form'], function(){
    var layer = layui.layer;
    var form = layui.form;

    // 存储采集的数据
    var collectedData = [];
    var currentKeyword = '';
    var currentSource = '';
    var crawlerConfigs = {};  // 存储爬虫配置

    // 加载爬虫列表
    function loadCrawlers() {
        fetch('/api/crawlers/active').then(r => r.json()).then(function(res) {
            var select = document.getElementById('source');
            if(res.code === 0 && res.data.length > 0) {
                var html = '';
                res.data.forEach(function(crawler, index) {
                    crawlerConfigs[crawler.code] = crawler;
                    html += '<option value="' + crawler.code + '"' + (index === 0 ? ' selected' : '') + '>' + crawler.name + '</option>';
                });
                select.innerHTML = html;
                currentSource = res.data[0].code;
            } else {
                select.innerHTML = '<option value="">无可用爬虫</option>';
                layer.msg('请先在爬虫管理中配置爬虫', {icon: 0, time: 3000});
            }
            form.render('select');
        }).catch(function() {
            document.getElementById('source').innerHTML = '<option value="baidu">百度新闻</option><option value="360kuai">360新闻</option>';
            form.render('select');
        });
    }

    // 初始化加载爬虫
    loadCrawlers();

    // 开始搜索
    document.getElementById('btnCollect').onclick = function() {
        var keyword = document.getElementById('keyword').value.trim();
        var countInput = document.getElementById('count');
        var count = parseInt(countInput.value) || 30;
        var source = document.getElementById('source').value;

        if (!keyword) {
            layer.msg('请输入搜索关键词', {icon: 0});
            return;
        }

        // 验证条数范围
        if (count < 1) count = 1;
        if (count > 200) count = 200;
        countInput.value = count;

        currentKeyword = keyword;
        currentSource = source;
        startCollect(keyword, count, source);
    };

    // 采集函数
    function startCollect(keyword, count, source) {
        var sourceName = source === '360kuai' ? '360新闻' : '百度新闻';

        // 显示进度条
        var progressWrap = document.getElementById('progressWrap');
        var progressInner = document.getElementById('progressInner');
        var progressText = document.getElementById('progressText');

        progressWrap.classList.add('show');
        progressInner.style.width = '10%';
        progressText.textContent = '正在连接' + sourceName + '...';

        // 禁用按钮
        document.getElementById('btnCollect').disabled = true;
        document.getElementById('btnCollect').innerHTML = '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 采集中...';

        // 模拟进度
        var progress = 10;
        var progressTimer = setInterval(function() {
            if (progress < 90) {
                progress += Math.random() * 15;
                progressInner.style.width = Math.min(progress, 90) + '%';

                if (progress < 30) {
                    progressText.textContent = '正在连接' + sourceName + '...';
                } else if (progress < 60) {
                    progressText.textContent = '正在从' + sourceName + '采集数据...';
                } else {
                    progressText.textContent = '正在处理数据，请稍候...';
                }
            }
        }, 500);

        // 发起请求
        console.log('发送采集请求:', { keyword: keyword, count: count, source: source });
        fetch('/api/news/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ keyword: keyword, count: count, source: source })
        })
        .then(res => {
            console.log('响应状态:', res.status, res.statusText);
            if (!res.ok) {
                throw new Error('HTTP错误: ' + res.status + ' ' + res.statusText);
            }
            return res.json();
        })
        .then(data => {
            console.log('响应数据:', data);
            clearInterval(progressTimer);
            progressInner.style.width = '100%';
            progressText.textContent = '采集完成！';

            setTimeout(function() {
                progressWrap.classList.remove('show');

                // 恢复按钮
                document.getElementById('btnCollect').disabled = false;
                document.getElementById('btnCollect').innerHTML = '<i class="layui-icon layui-icon-search"></i> 开始采集';

                if (data.code === 0 && data.data && data.data.length > 0) {
                    collectedData = data.data.map(function(item, index) {
                        return {
                            ...item,
                            id: index,
                            keyword: keyword,
                            deep_collected: false,
                            selected: false,
                            content: '',
                            publish_time: '',
                            author: ''
                        };
                    });
                    renderNewsList();
                    layer.msg('从' + (data.source_name || sourceName) + '成功采集 ' + data.data.length + ' 条数据', {icon: 1});
                } else if (data.code === 0 && (!data.data || data.data.length === 0)) {
                    document.getElementById('newsList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-face-surprised"></i><p>未找到相关数据，请尝试其他关键词或数据源</p></div>';
                    layer.msg('未找到匹配的数据', {icon: 0});
                } else {
                    document.getElementById('newsList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-face-surprised"></i><p>未找到相关数据，请尝试其他关键词或数据源</p></div>';
                    layer.msg(data.msg || '采集失败: ' + JSON.stringify(data), {icon: 2});
                }
            }, 500);
        })
        .catch(err => {
            console.error('请求错误:', err);
            clearInterval(progressTimer);
            progressWrap.classList.remove('show');
            document.getElementById('btnCollect').disabled = false;
            document.getElementById('btnCollect').innerHTML = '<i class="layui-icon layui-icon-search"></i> 开始采集';
            layer.msg('采集失败: ' + (err.message || '未知错误'), {icon: 2});
        });
    }

    // 渲染新闻列表
    function renderNewsList() {
        var html = '<div class="news-grid">';

        collectedData.forEach(function(item, index) {
            html += '<div class="news-card' + (item.selected ? ' selected' : '') + '" data-index="' + index + '">';
            html += '<div class="card-checkbox"><input type="checkbox" class="item-check" data-index="' + index + '"' + (item.selected ? ' checked' : '') + '></div>';
            html += '<a href="' + item.url + '" target="_blank"><img class="card-cover" src="' + item.cover + '" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect fill=%22%23f0f0f0%22 width=%22320%22 height=%22180%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22>No Image</text></svg>\'"></a>';
            html += '<div class="card-body">';
            html += '<div class="card-title" title="' + item.title + '">' + item.title + '</div>';
            html += '<div class="card-source"><i class="layui-icon layui-icon-website"></i> ' + (item.source || '未知来源') + '</div>';
            html += '<div class="card-actions">';

            if (item.deep_collected) {
                html += '<button class="layui-btn layui-btn-sm btn-deep collected" disabled><i class="layui-icon layui-icon-ok"></i> 已深度采集</button>';
            } else {
                html += '<button class="layui-btn layui-btn-sm layui-btn-primary btn-deep" onclick="deepCollect(' + index + ')"><i class="layui-icon layui-icon-download-circle"></i> 深度采集</button>';
            }

            html += '<button class="layui-btn layui-btn-sm layui-btn-normal btn-save" onclick="saveOne(' + index + ')"><i class="layui-icon layui-icon-add-1"></i></button>';
            html += '</div></div></div>';
        });

        html += '</div>';
        document.getElementById('newsList').innerHTML = html;

        // 显示统计和操作区
        document.getElementById('statsBar').style.display = 'flex';
        document.getElementById('selectAllWrap').style.display = 'flex';
        document.getElementById('btnSaveBatch').style.display = 'inline-block';

        updateStats();
        bindCheckboxEvents();
    }

    // 更新统计
    function updateStats() {
        var total = collectedData.length;
        var selected = collectedData.filter(function(item) { return item.selected; }).length;
        var deep = collectedData.filter(function(item) { return item.deep_collected; }).length;

        document.getElementById('totalCount').textContent = total;
        document.getElementById('selectedCount').textContent = selected;
        document.getElementById('deepCount').textContent = deep;
    }

    // 绑定复选框事件
    function bindCheckboxEvents() {
        // 单个选择
        document.querySelectorAll('.item-check').forEach(function(cb) {
            cb.onchange = function() {
                var index = parseInt(this.dataset.index);
                collectedData[index].selected = this.checked;
                this.closest('.news-card').classList.toggle('selected', this.checked);
                updateStats();
                updateSelectAll();
            };
        });

        // 全选
        document.getElementById('selectAll').onchange = function() {
            var checked = this.checked;
            collectedData.forEach(function(item) { item.selected = checked; });
            document.querySelectorAll('.item-check').forEach(function(cb) {
                cb.checked = checked;
                cb.closest('.news-card').classList.toggle('selected', checked);
            });
            updateStats();
        };
    }

    // 更新全选框状态
    function updateSelectAll() {
        var total = collectedData.length;
        var selected = collectedData.filter(function(item) { return item.selected; }).length;
        document.getElementById('selectAll').checked = (total > 0 && total === selected);
    }

    // 深度采集 - 挂载到window
    window.deepCollect = function(index) {
        var item = collectedData[index];
        var btn = document.querySelectorAll('.btn-deep')[index];

        btn.disabled = true;
        btn.innerHTML = '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 采集中...';

        fetch('/api/collect/deep', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: item.url })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 0) {
                collectedData[index].deep_collected = true;
                collectedData[index].content = data.data.content || '';
                collectedData[index].publish_time = data.data.publish_time || '';
                collectedData[index].author = data.data.author || '';

                btn.className = 'layui-btn layui-btn-sm btn-deep collected';
                btn.innerHTML = '<i class="layui-icon layui-icon-ok"></i> 已深度采集';
                updateStats();
                layer.msg('深度采集成功', {icon: 1});
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="layui-icon layui-icon-download-circle"></i> 深度采集';
                layer.msg(data.msg || '深度采集失败', {icon: 2});
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = '<i class="layui-icon layui-icon-download-circle"></i> 深度采集';
            layer.msg('深度采集失败: ' + err.message, {icon: 2});
        });
    };

    // 保存单条
    window.saveOne = function(index) {
        var item = collectedData[index];

        layer.confirm('确定要保存这条数据到数据库吗？', {icon: 3, title: '确认'}, function(idx) {
            fetch('/api/collect/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) {
                    layer.msg('保存成功', {icon: 1});
                } else {
                    layer.msg(data.msg, {icon: 0});
                }
            })
            .catch(err => {
                layer.msg('保存失败: ' + err.message, {icon: 2});
            });
            layer.close(idx);
        });
    };

    // 批量保存（带进度条）
    document.getElementById('btnSaveBatch').onclick = function() {
        var selectedItems = collectedData.filter(function(item) { return item.selected; });

        if (selectedItems.length === 0) {
            layer.msg('请先选择要保存的数据', {icon: 0});
            return;
        }

        // 显示进度弹窗
        var total = selectedItems.length;
        var progressHtml = `
            <div class="save-progress-wrap" style="padding: 20px;">
                <div class="progress-header" style="display:flex;justify-content:space-between;margin-bottom:15px;">
                    <span style="font-size:14px;color:#333;">正在保存数据...</span>
                    <span id="progressCount" style="font-size:14px;color:#667eea;font-weight:600;">0/${total}</span>
                </div>
                <div class="progress-bar-container" style="background:#e9ecef;border-radius:10px;height:20px;overflow:hidden;margin-bottom:15px;">
                    <div id="progressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:10px;transition:width 0.3s ease;"></div>
                </div>
                <div id="progressStatus" style="font-size:12px;color:#888;margin-bottom:10px;height:40px;overflow:hidden;">
                    准备开始...
                </div>
                <div class="progress-stats" style="display:flex;gap:15px;padding:12px;background:#f8f9fa;border-radius:8px;">
                    <div style="flex:1;text-align:center;">
                        <div id="statSuccess" style="font-size:20px;font-weight:700;color:#43a047;">0</div>
                        <div style="font-size:11px;color:#888;">保存成功</div>
                    </div>
                    <div style="flex:1;text-align:center;">
                        <div id="statDeep" style="font-size:20px;font-weight:700;color:#667eea;">0</div>
                        <div style="font-size:11px;color:#888;">深度采集</div>
                    </div>
                    <div style="flex:1;text-align:center;">
                        <div id="statSkip" style="font-size:20px;font-weight:700;color:#f57c00;">0</div>
                        <div style="font-size:11px;color:#888;">已跳过</div>
                    </div>
                    <div style="flex:1;text-align:center;">
                        <div id="statFail" style="font-size:20px;font-weight:700;color:#e53935;">0</div>
                        <div style="font-size:11px;color:#888;">保存失败</div>
                    </div>
                </div>
            </div>
        `;

        var progressIdx = layer.open({
            type: 1,
            title: '批量保存进度',
            area: ['450px', 'auto'],
            content: progressHtml,
            closeBtn: 0,
            shadeClose: false,
            btn: ['完成'],
            btnAlign: 'c',
            btn1: function(index) {
                layer.close(index);
            },
            success: function(layero) {
                // 初始时禁用完成按钮
                layero.find('.layui-layer-btn0').addClass('layui-btn-disabled').css('pointer-events', 'none');

                // 开始逐条保存
                executeBatchSave(selectedItems, layero);
            }
        });
    };

    // 执行批量保存（逐条处理）
    async function executeBatchSave(items, layero) {
        var total = items.length;
        var current = 0;
        var successCount = 0;
        var deepCount = 0;
        var skipCount = 0;
        var failCount = 0;

        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            current = i + 1;

            // 更新状态显示
            var shortTitle = item.title.length > 30 ? item.title.substring(0, 30) + '...' : item.title;
            layero.find('#progressStatus').html('<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="margin-right:5px;"></i>正在处理: ' + shortTitle);

            try {
                var response = await fetch('/api/collect/save-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: [item] })
                });
                var result = await response.json();

                if (result.code === 0 && result.data) {
                    if (result.data.saved > 0) {
                        successCount++;
                        if (result.data.deep_collected > 0) {
                            deepCount++;
                        }
                    } else if (result.data.skipped > 0) {
                        skipCount++;
                    }
                } else {
                    failCount++;
                }
            } catch (err) {
                failCount++;
            }

            // 更新进度条
            var percent = Math.round((current / total) * 100);
            layero.find('#progressBar').css('width', percent + '%');
            layero.find('#progressCount').text(current + '/' + total);

            // 更新统计
            layero.find('#statSuccess').text(successCount);
            layero.find('#statDeep').text(deepCount);
            layero.find('#statSkip').text(skipCount);
            layero.find('#statFail').text(failCount);
        }

        // 完成
        layero.find('#progressStatus').html('<i class="layui-icon layui-icon-ok-circle" style="color:#43a047;margin-right:5px;"></i>保存完成！');
        layero.find('.layui-layer-btn0').removeClass('layui-btn-disabled').css('pointer-events', 'auto');

        // 清除已保存成功的选中状态
        collectedData.forEach(function(item) {
            item.selected = false;
        });
        renderList();
        document.getElementById('btnSaveBatch').style.display = 'none';
    }
});
</script>
{% endblock %}
