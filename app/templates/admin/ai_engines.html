{% extends "admin/base_admin.html" %}

{% block title %}AI引擎管理{% endblock %}

{% block extra_css %}
<style>
    /* 页面头部 */
    .page-header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        border-radius: 16px;
        padding: 32px 40px;
        margin-bottom: 24px;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
    }
    .page-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 70%);
        animation: headerGlow 4s ease-in-out infinite;
    }
    @keyframes headerGlow {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
        50% { transform: scale(1.2) rotate(180deg); opacity: 0.8; }
    }
    .page-header h2 {
        font-size: 26px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
        z-index: 1;
    }
    .page-header h2 i {
        font-size: 36px;
        color: #00f2ff;
        text-shadow: 0 0 30px rgba(0,242,255,0.6);
        animation: iconFloat 3s ease-in-out infinite;
    }
    @keyframes iconFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    .page-header p {
        opacity: 0.8;
        font-size: 14px;
        margin-top: 8px;
        position: relative;
        z-index: 1;
    }
    .page-header .header-actions {
        position: relative;
        z-index: 1;
    }
    .btn-add-engine {
        background: linear-gradient(135deg, #00f2ff 0%, #4facfe 100%);
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #1a1a2e;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 25px rgba(0,242,255,0.35);
    }
    .btn-add-engine:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(0,242,255,0.5);
    }
    .btn-add-engine i {
        font-size: 18px;
    }

    /* 统计栏 */
    .stats-bar {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
    }
    .stat-item {
        background: #fff;
        border-radius: 14px;
        padding: 20px 28px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        flex: 1;
        transition: all 0.3s ease;
    }
    .stat-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .stat-item .stat-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #fff;
    }
    .stat-item:nth-child(1) .stat-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
    .stat-item:nth-child(2) .stat-icon { background: linear-gradient(135deg, #11998e, #38ef7d); }
    .stat-item:nth-child(3) .stat-icon { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .stat-item .stat-info h3 {
        font-size: 28px;
        font-weight: 700;
        color: #333;
        margin-bottom: 4px;
    }
    .stat-item .stat-info p {
        font-size: 13px;
        color: #888;
    }

    /* 引擎橱窗列表 */
    .engines-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 24px;
    }
    .engine-card {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }
    .engine-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .engine-card.disabled {
        opacity: 0.6;
    }
    .engine-card .card-header {
        padding: 28px;
        position: relative;
        overflow: hidden;
    }
    .engine-card .card-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
        animation: cardShine 3s ease-in-out infinite;
    }
    @keyframes cardShine {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(180deg); }
    }
    .engine-card .engine-icon {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: #fff;
        margin-bottom: 18px;
        position: relative;
        z-index: 1;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .engine-card .engine-name {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 6px;
        position: relative;
        z-index: 1;
    }
    .engine-card .engine-provider {
        font-size: 13px;
        color: rgba(255,255,255,0.8);
        position: relative;
        z-index: 1;
    }
    .engine-card .default-badge {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255,255,255,0.25);
        backdrop-filter: blur(10px);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        color: #fff;
        font-weight: 600;
        z-index: 2;
    }
    .engine-card .status-badge {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        z-index: 2;
        box-shadow: 0 0 10px currentColor;
    }
    .engine-card .status-badge.online { background: #38ef7d; color: #38ef7d; }
    .engine-card .status-badge.offline { background: #ff6b6b; color: #ff6b6b; }
    .engine-card .card-body {
        padding: 24px 28px;
        background: #fff;
    }
    .engine-card .info-row {
        display: flex;
        align-items: center;
        margin-bottom: 14px;
        font-size: 13px;
    }
    .engine-card .info-row:last-child {
        margin-bottom: 0;
    }
    .engine-card .info-row .label {
        color: #888;
        width: 80px;
        flex-shrink: 0;
    }
    .engine-card .info-row .value {
        color: #333;
        font-weight: 500;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .engine-card .info-row .value.url {
        font-family: 'Consolas', monospace;
        font-size: 12px;
        color: #666;
    }
    .engine-card .info-row .value.key {
        font-family: 'Consolas', monospace;
        font-size: 12px;
        color: #999;
        letter-spacing: 1px;
    }
    .engine-card .card-footer {
        padding: 18px 28px;
        border-top: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fafafa;
    }
    .engine-card .card-footer .time {
        font-size: 12px;
        color: #aaa;
    }
    .engine-card .card-footer .actions {
        display: flex;
        gap: 8px;
    }
    .engine-card .action-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        transition: all 0.3s ease;
    }
    .action-btn.test { background: rgba(0,242,255,0.1); color: #00c6fb; }
    .action-btn.edit { background: rgba(40,167,69,0.1); color: #28a745; }
    .action-btn.delete { background: rgba(220,53,69,0.1); color: #dc3545; }
    .action-btn.default { background: rgba(255,193,7,0.1); color: #ffc107; }
    .action-btn:hover {
        transform: scale(1.1);
    }

    /* 空状态 */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .empty-state i {
        font-size: 80px;
        color: #ddd;
        margin-bottom: 24px;
    }
    .empty-state h3 {
        font-size: 20px;
        color: #666;
        margin-bottom: 12px;
    }
    .empty-state p {
        font-size: 14px;
        color: #999;
        margin-bottom: 28px;
    }

    /* 表单样式 */
    .form-group {
        margin-bottom: 22px;
    }
    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #333;
        font-size: 14px;
    }
    .form-group label .required {
        color: #f5576c;
        margin-left: 4px;
    }
    .form-group .layui-input,
    .form-group .layui-textarea,
    .form-group select {
        border-radius: 10px;
        border: 2px solid #e8e8e8;
        padding: 12px 16px;
        font-size: 14px;
        transition: all 0.3s ease;
        width: 100%;
        box-sizing: border-box;
    }
    .form-group .layui-input:focus,
    .form-group .layui-textarea:focus,
    .form-group select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
    }
    .form-group .help-text {
        font-size: 12px;
        color: #999;
        margin-top: 8px;
    }
    .form-row {
        display: flex;
        gap: 20px;
    }
    .form-row .form-group {
        flex: 1;
    }

    /* 颜色选择器 */
    .color-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .color-option {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        cursor: pointer;
        border: 3px solid transparent;
        transition: all 0.3s ease;
    }
    .color-option:hover {
        transform: scale(1.1);
    }
    .color-option.selected {
        border-color: #333;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 图标选择器 */
    .icon-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .icon-option {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        cursor: pointer;
        border: 2px solid #e8e8e8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #666;
        transition: all 0.3s ease;
        background: #fff;
    }
    .icon-option:hover {
        border-color: #667eea;
        color: #667eea;
    }
    .icon-option.selected {
        border-color: #667eea;
        background: #667eea;
        color: #fff;
    }

    /* 测试结果弹窗 */
    .test-result {
        padding: 24px;
    }
    .test-result .result-status {
        text-align: center;
        padding: 30px;
    }
    .test-result .result-status i {
        font-size: 60px;
        margin-bottom: 16px;
    }
    .test-result .result-status.success i { color: #38ef7d; }
    .test-result .result-status.error i { color: #ff6b6b; }
    .test-result .result-status h3 {
        font-size: 18px;
        margin-bottom: 8px;
    }
    .test-result .result-status p {
        color: #888;
        font-size: 14px;
    }
    .test-result .result-detail {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
        font-size: 13px;
    }
    .test-result .result-detail .item {
        display: flex;
        margin-bottom: 10px;
    }
    .test-result .result-detail .item:last-child {
        margin-bottom: 0;
    }
    .test-result .result-detail .item .label {
        color: #888;
        width: 80px;
    }
    .test-result .result-detail .item .value {
        color: #333;
        flex: 1;
    }

    /* AI对话按钮 */
    .btn-chat-ai {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 25px rgba(17,153,142,0.35);
    }
    .btn-chat-ai:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(17,153,142,0.5);
    }
    .btn-chat-ai i {
        font-size: 18px;
    }

    /* 聊天对话框样式 */
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 520px;
    }
    .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .chat-header .engine-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .chat-header .engine-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
    }
    .chat-header .engine-name {
        font-weight: 600;
        color: #333;
    }
    .chat-header .engine-model {
        font-size: 12px;
        color: #888;
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
    }
    .chat-message {
        margin-bottom: 16px;
        display: flex;
        gap: 12px;
    }
    .chat-message.user {
        flex-direction: row-reverse;
    }
    .chat-message .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
    }
    .chat-message.user .avatar {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
    }
    .chat-message.assistant .avatar {
        background: linear-gradient(135deg, #11998e, #38ef7d);
        color: #fff;
    }
    .chat-message .content {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.6;
    }
    .chat-message.user .content {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .chat-message.assistant .content {
        background: #fff;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .chat-message .typing {
        display: flex;
        gap: 4px;
        padding: 8px 0;
    }
    .chat-message .typing span {
        width: 8px;
        height: 8px;
        background: #aaa;
        border-radius: 50%;
        animation: typing 1.4s infinite;
    }
    .chat-message .typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-message .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }
    .chat-input-area {
        padding: 16px 20px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 12px;
        background: #fff;
    }
    .chat-input-area input {
        flex: 1;
        border: 2px solid #e8e8e8;
        border-radius: 24px;
        padding: 12px 20px;
        font-size: 14px;
        outline: none;
        transition: all 0.3s;
    }
    .chat-input-area input:focus {
        border-color: #667eea;
    }
    .chat-input-area .send-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
    }
    .chat-input-area .send-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    }
    .chat-input-area .send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
    .chat-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
    }
    .chat-empty i {
        font-size: 60px;
        margin-bottom: 16px;
        color: #ddd;
    }
    .chat-empty p {
        font-size: 14px;
    }
</style>
{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="page-header">
    <div>
        <h2><i class="layui-icon layui-icon-auz"></i>AI引擎管理</h2>
        <p>接入第三方大模型服务，为智能舆情分析提供AI能力支持</p>
    </div>
    <div class="header-actions">
        <button class="btn-chat-ai" id="btnChatAI" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); margin-right: 12px;">
            <i class="layui-icon layui-icon-dialogue"></i>AI对话
        </button>
        <button class="btn-add-engine" id="btnAddEngine">
            <i class="layui-icon layui-icon-add-1"></i>接入新引擎
        </button>
    </div>
</div>

<!-- 统计栏 -->
<div class="stats-bar">
    <div class="stat-item">
        <div class="stat-icon"><i class="layui-icon layui-icon-engine"></i></div>
        <div class="stat-info">
            <h3 id="statTotal">0</h3>
            <p>引擎总数</p>
        </div>
    </div>
    <div class="stat-item">
        <div class="stat-icon"><i class="layui-icon layui-icon-ok-circle"></i></div>
        <div class="stat-info">
            <h3 id="statEnabled">0</h3>
            <p>已启用</p>
        </div>
    </div>
    <div class="stat-item">
        <div class="stat-icon"><i class="layui-icon layui-icon-star-fill"></i></div>
        <div class="stat-info">
            <h3 id="statDefault">-</h3>
            <p>默认引擎</p>
        </div>
    </div>
</div>

<!-- 引擎橱窗列表 -->
<div class="engines-grid" id="enginesGrid">
    <!-- 动态渲染 -->
</div>

<!-- 空状态 -->
<div class="empty-state" id="emptyState" style="display:none;">
    <i class="layui-icon layui-icon-auz"></i>
    <h3>暂无AI引擎</h3>
    <p>点击上方按钮接入您的第一个AI大模型服务</p>
    <button class="btn-add-engine" onclick="openEngineForm()">
        <i class="layui-icon layui-icon-add-1"></i>立即接入
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script>
layui.use(['layer', 'form'], function(){
    var layer = layui.layer;
    var form = layui.form;
    var $ = layui.$;

    // 预设颜色
    var colorOptions = [
        '#667eea', '#764ba2', '#11998e', '#38ef7d', '#00c6fb', '#005bea',
        '#f093fb', '#f5576c', '#4facfe', '#00f2ff', '#ff6b6b', '#ffc107'
    ];

    // 预设图标
    var iconOptions = [
        'layui-icon-auz', 'layui-icon-engine', 'layui-icon-dialogue',
        'layui-icon-app', 'layui-icon-component', 'layui-icon-template',
        'layui-icon-senior', 'layui-icon-console', 'layui-icon-util'
    ];

    // 加载引擎列表
    function loadEngines() {
        $.get('/api/ai-engines/list', function(res) {
            if (res.code === 0) {
                renderEngines(res.data);
                updateStats(res.data);
            }
        });
    }

    // 渲染引擎卡片
    function renderEngines(engines) {
        var grid = $('#enginesGrid');
        var empty = $('#emptyState');

        if (engines.length === 0) {
            grid.hide();
            empty.show();
            return;
        }

        empty.hide();
        grid.show();

        var html = '';
        engines.forEach(function(engine) {
            var statusClass = engine.status === 1 ? 'online' : 'offline';
            var cardClass = engine.status === 1 ? '' : 'disabled';

            html += '<div class="engine-card ' + cardClass + '" data-id="' + engine.id + '">';
            html += '<div class="card-header" style="background: linear-gradient(135deg, ' + engine.color + ' 0%, ' + adjustColor(engine.color, -30) + ' 100%);">';
            html += '<span class="status-badge ' + statusClass + '"></span>';
            if (engine.is_default) {
                html += '<span class="default-badge">默认</span>';
            }
            html += '<div class="engine-icon" style="background: rgba(255,255,255,0.2);"><i class="layui-icon ' + engine.icon + '"></i></div>';
            html += '<div class="engine-name">' + engine.name + '</div>';
            html += '<div class="engine-provider">' + engine.provider + '</div>';
            html += '</div>';
            html += '<div class="card-body">';
            html += '<div class="info-row"><span class="label">模型</span><span class="value">' + engine.model_name + '</span></div>';
            html += '<div class="info-row"><span class="label">API地址</span><span class="value url" title="' + engine.api_url + '">' + engine.api_url + '</span></div>';
            html += '<div class="info-row"><span class="label">API密钥</span><span class="value key">' + engine.api_key + '</span></div>';
            html += '<div class="info-row"><span class="label">参数</span><span class="value">tokens: ' + engine.max_tokens + ' / temp: ' + engine.temperature + '</span></div>';
            html += '</div>';
            html += '<div class="card-footer">';
            html += '<span class="time">更新于 ' + engine.updated_at + '</span>';
            html += '<div class="actions">';
            html += '<button class="action-btn test" onclick="testEngine(' + engine.id + ')" title="测试连接"><i class="layui-icon layui-icon-play"></i></button>';
            if (!engine.is_default) {
                html += '<button class="action-btn default" onclick="setDefault(' + engine.id + ')" title="设为默认"><i class="layui-icon layui-icon-star"></i></button>';
            }
            html += '<button class="action-btn edit" onclick="editEngine(' + engine.id + ')" title="编辑"><i class="layui-icon layui-icon-edit"></i></button>';
            html += '<button class="action-btn delete" onclick="deleteEngine(' + engine.id + ', \'' + engine.name + '\')" title="删除"><i class="layui-icon layui-icon-delete"></i></button>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });

        grid.html(html);
    }

    // 更新统计
    function updateStats(engines) {
        $('#statTotal').text(engines.length);
        var enabled = engines.filter(function(e) { return e.status === 1; }).length;
        $('#statEnabled').text(enabled);
        var defaultEngine = engines.find(function(e) { return e.is_default; });
        $('#statDefault').text(defaultEngine ? defaultEngine.name : '-');
    }

    // 颜色调整函数
    function adjustColor(color, amount) {
        var usePound = false;
        if (color[0] === "#") {
            color = color.slice(1);
            usePound = true;
        }
        var num = parseInt(color, 16);
        var r = Math.min(255, Math.max(0, (num >> 16) + amount));
        var g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
        var b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
        return (usePound ? "#" : "") + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // 打开表单
    window.openEngineForm = function(data) {
        data = data || {};
        var isEdit = !!data.id;
        var title = isEdit ? '编辑AI引擎' : '接入新引擎';

        var colorHtml = colorOptions.map(function(c) {
            var selected = (data.color || '#667eea') === c ? 'selected' : '';
            return '<div class="color-option ' + selected + '" style="background:' + c + ';" data-color="' + c + '"></div>';
        }).join('');

        var iconHtml = iconOptions.map(function(i) {
            var selected = (data.icon || 'layui-icon-auz') === i ? 'selected' : '';
            return '<div class="icon-option ' + selected + '" data-icon="' + i + '"><i class="layui-icon ' + i + '"></i></div>';
        }).join('');

        var html = '<form class="layui-form" style="padding:28px;" lay-filter="engineForm">';
        html += '<input type="hidden" name="id" value="' + (data.id || '') + '">';

        html += '<div class="form-row">';
        html += '<div class="form-group"><label>引擎名称<span class="required">*</span></label>';
        html += '<input type="text" name="name" class="layui-input" value="' + (data.name || '') + '" placeholder="例如：GPT-4智能助手" lay-verify="required"></div>';
        html += '<div class="form-group"><label>服务商名称<span class="required">*</span></label>';
        html += '<input type="text" name="provider" class="layui-input" value="' + (data.provider || '') + '" placeholder="例如：OpenAI、阿里云、百度" lay-verify="required"></div>';
        html += '</div>';

        html += '<div class="form-group"><label>API地址<span class="required">*</span></label>';
        html += '<input type="text" name="api_url" class="layui-input" value="' + (data.api_url || '') + '" placeholder="例如：https://api.openai.com/v1/chat/completions" lay-verify="required">';
        html += '<div class="help-text">填写符合OpenAI API格式的接口地址</div></div>';

        html += '<div class="form-group"><label>API密钥<span class="required">*</span></label>';
        html += '<input type="text" name="api_key" class="layui-input" value="' + (data.api_key_full || '') + '" placeholder="sk-xxxxxxxx" lay-verify="required">';
        html += '<div class="help-text">请妥善保管您的API密钥</div></div>';

        html += '<div class="form-row">';
        html += '<div class="form-group"><label>模型名称<span class="required">*</span></label>';
        html += '<input type="text" name="model_name" class="layui-input" value="' + (data.model_name || '') + '" placeholder="例如：gpt-4、qwen-turbo" lay-verify="required"></div>';
        html += '<div class="form-group"><label>状态</label>';
        html += '<select name="status"><option value="1" ' + (data.status !== 0 ? 'selected' : '') + '>启用</option><option value="0" ' + (data.status === 0 ? 'selected' : '') + '>禁用</option></select></div>';
        html += '</div>';

        html += '<div class="form-row">';
        html += '<div class="form-group"><label>最大Tokens</label>';
        html += '<input type="number" name="max_tokens" class="layui-input" value="' + (data.max_tokens || 4096) + '" placeholder="4096"></div>';
        html += '<div class="form-group"><label>Temperature</label>';
        html += '<input type="number" name="temperature" class="layui-input" value="' + (data.temperature || 0.7) + '" step="0.1" min="0" max="2" placeholder="0.7"></div>';
        html += '</div>';

        html += '<div class="form-group"><label>主题色</label>';
        html += '<div class="color-options">' + colorHtml + '</div>';
        html += '<input type="hidden" name="color" value="' + (data.color || '#667eea') + '">';
        html += '</div>';

        html += '<div class="form-group"><label>图标</label>';
        html += '<div class="icon-options">' + iconHtml + '</div>';
        html += '<input type="hidden" name="icon" value="' + (data.icon || 'layui-icon-auz') + '">';
        html += '</div>';

        html += '<div class="form-group"><label>描述</label>';
        html += '<textarea name="description" class="layui-textarea" style="height:80px;" placeholder="可选，描述此引擎的用途...">' + (data.description || '') + '</textarea></div>';

        html += '</form>';

        layer.open({
            type: 1,
            title: title,
            area: ['600px', '680px'],
            content: html,
            success: function(layero) {
                form.render();

                // 颜色选择
                layero.find('.color-option').on('click', function() {
                    layero.find('.color-option').removeClass('selected');
                    $(this).addClass('selected');
                    layero.find('input[name="color"]').val($(this).data('color'));
                });

                // 图标选择
                layero.find('.icon-option').on('click', function() {
                    layero.find('.icon-option').removeClass('selected');
                    $(this).addClass('selected');
                    layero.find('input[name="icon"]').val($(this).data('icon'));
                });
            },
            btn: ['保存', '取消'],
            yes: function(index, layero) {
                var formData = {};
                layero.find('form').serializeArray().forEach(function(item) {
                    formData[item.name] = item.value;
                });

                if (!formData.name || !formData.provider || !formData.api_url || !formData.api_key || !formData.model_name) {
                    layer.msg('请填写所有必填项', {icon: 0});
                    return;
                }

                var url = formData.id ? '/api/ai-engines/update' : '/api/ai-engines/add';
                $.ajax({
                    url: url,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(formData),
                    success: function(res) {
                        if (res.code === 0) {
                            layer.msg(res.msg, {icon: 1});
                            layer.close(index);
                            loadEngines();
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
            }
        });
    };

    // 编辑引擎
    window.editEngine = function(id) {
        $.get('/api/ai-engines/' + id, function(res) {
            if (res.code === 0) {
                openEngineForm(res.data);
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        });
    };

    // 删除引擎
    window.deleteEngine = function(id, name) {
        layer.confirm('确定要删除引擎【' + name + '】吗？', {icon: 3}, function(index) {
            $.ajax({
                url: '/api/ai-engines/delete',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({id: id}),
                success: function(res) {
                    if (res.code === 0) {
                        layer.msg('删除成功', {icon: 1});
                        loadEngines();
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }
            });
            layer.close(index);
        });
    };

    // 设为默认
    window.setDefault = function(id) {
        $.ajax({
            url: '/api/ai-engines/set-default',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id}),
            success: function(res) {
                if (res.code === 0) {
                    layer.msg('设置成功', {icon: 1});
                    loadEngines();
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }
        });
    };

    // 测试引擎
    window.testEngine = function(id) {
        var loadIdx = layer.load(1, {shade: [0.3, '#000']});

        $.ajax({
            url: '/api/ai-engines/test',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id}),
            success: function(res) {
                layer.close(loadIdx);

                var html = '<div class="test-result">';
                if (res.code === 0) {
                    html += '<div class="result-status success">';
                    html += '<i class="layui-icon layui-icon-ok-circle"></i>';
                    html += '<h3>连接成功</h3>';
                    html += '<p>AI引擎响应正常</p>';
                    html += '</div>';
                    if (res.data) {
                        html += '<div class="result-detail">';
                        html += '<div class="item"><span class="label">响应时间</span><span class="value">' + (res.data.response_time || '-') + '</span></div>';
                        html += '<div class="item"><span class="label">模型</span><span class="value">' + (res.data.model || '-') + '</span></div>';
                        if (res.data.reply) {
                            html += '<div class="item"><span class="label">测试回复</span><span class="value">' + res.data.reply.substring(0, 100) + '...</span></div>';
                        }
                        html += '</div>';
                    }
                } else {
                    html += '<div class="result-status error">';
                    html += '<i class="layui-icon layui-icon-close-fill"></i>';
                    html += '<h3>连接失败</h3>';
                    html += '<p>' + res.msg + '</p>';
                    html += '</div>';
                }
                html += '</div>';

                layer.open({
                    type: 1,
                    title: '测试结果',
                    area: ['420px', 'auto'],
                    content: html
                });
            },
            error: function() {
                layer.close(loadIdx);
                layer.msg('请求失败', {icon: 2});
            }
        });
    };

    // 新增按钮点击
    $('#btnAddEngine').on('click', function() {
        openEngineForm();
    });

    // ============ AI对话功能 ============
    var chatHistory = [];
    var currentEngine = null;
    var chatLayerIndex = null;

    // 打开聊天对话框
    function openChatDialog() {
        // 获取可用引擎列表
        $.get('/api/ai-engines/list', function(res) {
            if (res.code !== 0 || res.data.length === 0) {
                layer.msg('没有可用的AI引擎，请先配置', {icon: 0});
                return;
            }

            // 找到默认或第一个启用的引擎
            var engines = res.data.filter(function(e) { return e.status === 1; });
            if (engines.length === 0) {
                layer.msg('没有启用的AI引擎', {icon: 0});
                return;
            }

            currentEngine = engines.find(function(e) { return e.is_default; }) || engines[0];

            // 构建引擎选择下拉框
            var engineOptions = engines.map(function(e) {
                var selected = e.id === currentEngine.id ? 'selected' : '';
                return '<option value="' + e.id + '" ' + selected + '>' + e.name + ' (' + e.model_name + ')</option>';
            }).join('');

            var chatHtml = '<div class="chat-container">';
            chatHtml += '<div class="chat-header">';
            chatHtml += '<div class="engine-info">';
            chatHtml += '<div class="engine-icon" id="chatEngineIcon" style="background:' + currentEngine.color + '"><i class="layui-icon ' + currentEngine.icon + '"></i></div>';
            chatHtml += '<div><div class="engine-name" id="chatEngineName">' + currentEngine.name + '</div>';
            chatHtml += '<div class="engine-model" id="chatEngineModel">' + currentEngine.model_name + '</div></div>';
            chatHtml += '</div>';
            chatHtml += '<select id="chatEngineSelect" style="border: 1px solid #ddd; border-radius: 8px; padding: 6px 12px; font-size: 13px;">' + engineOptions + '</select>';
            chatHtml += '</div>';
            chatHtml += '<div class="chat-messages" id="chatMessages">';
            chatHtml += '<div class="chat-empty"><i class="layui-icon layui-icon-dialogue"></i><p>开始与AI助手对话吧</p></div>';
            chatHtml += '</div>';
            chatHtml += '<div class="chat-input-area">';
            chatHtml += '<input type="text" id="chatInput" placeholder="输入消息，按Enter发送..." autocomplete="off">';
            chatHtml += '<button class="send-btn" id="chatSendBtn"><i class="layui-icon layui-icon-top"></i></button>';
            chatHtml += '</div>';
            chatHtml += '</div>';

            chatLayerIndex = layer.open({
                type: 1,
                title: 'AI智能对话',
                area: ['600px', '620px'],
                content: chatHtml,
                success: function(layero) {
                    chatHistory = [];

                    // 引擎切换
                    $('#chatEngineSelect').on('change', function() {
                        var engineId = $(this).val();
                        var engine = engines.find(function(e) { return e.id == engineId; });
                        if (engine) {
                            currentEngine = engine;
                            $('#chatEngineIcon').css('background', engine.color).html('<i class="layui-icon ' + engine.icon + '"></i>');
                            $('#chatEngineName').text(engine.name);
                            $('#chatEngineModel').text(engine.model_name);
                        }
                    });

                    // 发送消息
                    function sendMessage() {
                        var input = $('#chatInput');
                        var message = input.val().trim();
                        if (!message) return;

                        // 显示用户消息
                        appendMessage('user', message);
                        input.val('');

                        // 显示加载状态
                        appendTyping();

                        // 禁用发送按钮
                        $('#chatSendBtn').prop('disabled', true);

                        // 发送请求
                        $.ajax({
                            url: '/api/ai/chat',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({
                                message: message,
                                engine_id: currentEngine.id,
                                history: chatHistory
                            }),
                            success: function(res) {
                                removeTyping();
                                $('#chatSendBtn').prop('disabled', false);

                                if (res.code === 0) {
                                    var reply = res.data.reply;
                                    appendMessage('assistant', reply);
                                    // 保存到历史
                                    chatHistory.push({role: 'user', content: message});
                                    chatHistory.push({role: 'assistant', content: reply});
                                } else {
                                    appendMessage('assistant', '抱歉，发生错误：' + res.msg);
                                }
                            },
                            error: function() {
                                removeTyping();
                                $('#chatSendBtn').prop('disabled', false);
                                appendMessage('assistant', '抱歉，网络请求失败，请稍后重试。');
                            }
                        });
                    }

                    // 点击发送
                    $('#chatSendBtn').on('click', sendMessage);

                    // Enter发送
                    $('#chatInput').on('keypress', function(e) {
                        if (e.which === 13) {
                            sendMessage();
                        }
                    });

                    // 聚焦输入框
                    $('#chatInput').focus();
                }
            });
        });
    }

    // 添加消息到聊天框
    function appendMessage(role, content) {
        var messagesDiv = $('#chatMessages');
        // 移除空状态
        messagesDiv.find('.chat-empty').remove();

        var avatar = role === 'user' ? '<i class="layui-icon layui-icon-user"></i>' : '<i class="layui-icon layui-icon-auz"></i>';
        var html = '<div class="chat-message ' + role + '">';
        html += '<div class="avatar">' + avatar + '</div>';
        html += '<div class="content">' + escapeHtml(content).replace(/\n/g, '<br>') + '</div>';
        html += '</div>';

        messagesDiv.append(html);
        messagesDiv.scrollTop(messagesDiv[0].scrollHeight);
    }

    // 显示加载动画
    function appendTyping() {
        var messagesDiv = $('#chatMessages');
        var html = '<div class="chat-message assistant typing-message">';
        html += '<div class="avatar"><i class="layui-icon layui-icon-auz"></i></div>';
        html += '<div class="content"><div class="typing"><span></span><span></span><span></span></div></div>';
        html += '</div>';
        messagesDiv.append(html);
        messagesDiv.scrollTop(messagesDiv[0].scrollHeight);
    }

    // 移除加载动画
    function removeTyping() {
        $('#chatMessages .typing-message').remove();
    }

    // HTML转义
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // AI对话按钮点击
    $('#btnChatAI').on('click', function() {
        openChatDialog();
    });

    // 初始加载
    loadEngines();
});
</script>
{% endblock %}
