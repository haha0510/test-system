<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政企智能舆情分析系统 - 登录</title>
    <style>
        :root {
            --bg-deep-1: #020b1c;
            --bg-deep-2: #000000;
            --tech-cyan: #00f2ff;
            --tech-blue: #0077ff;
            --gov-gold: #d4af37;
            --gov-gold-muted: #a68b3c;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 242, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-deep-1) 0%, var(--bg-deep-2) 100%);
            overflow: hidden;
            color: var(--text-primary);
        }

        #data-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: scale(0.98);
            animation: pageEntrance 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .login-card {
            width: 480px;
            padding: 50px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 0 30px rgba(0, 242, 255, 0.05);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card-header {
            margin-bottom: 40px;
        }

        .platform-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(45deg, var(--tech-blue), var(--tech-cyan));
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>') no-repeat center / contain;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>') no-repeat center / contain;
            margin: 0 auto 20px;
            opacity: 0.9;
        }

        .card-header h1 {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--text-primary), var(--gov-gold-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-header p {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: var(--tech-cyan);
            margin-bottom: 8px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .input-field-container {
            position: relative;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field-container::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, var(--tech-cyan), var(--tech-blue));
            transition: width 0.4s ease;
        }

        .input-group:focus-within .input-field-container::after {
            width: 100%;
        }

        .input-field-container input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .input-field-container input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-icon {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tech-cyan);
            opacity: 0.5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--tech-blue), var(--tech-cyan));
            color: #000;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 255, 0.4);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: none;
        }

        .login-btn.loading::before {
            animation: shine 1.5s infinite;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .extra-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .extra-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .extra-links a:hover {
            color: var(--tech-cyan);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 20px;
            text-align: center;
        }

        @keyframes pageEntrance {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shine {
            to { left: 100%; }
        }

        .login-wrapper.logging-success .login-card {
            transform: scale(0.8) translateY(-50px);
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 520px) {
            .login-card {
                width: 90%;
                padding: 40px 25px;
            }
            .card-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="data-canvas-container"></canvas>

    <div class="login-wrapper" id="loginWrapper">
        <div class="login-card">
            <div class="card-header">
                <div class="platform-logo"></div>
                <h1>政企智能舆情分析系统</h1>
                <p>感知社情民意 · 驱动科学决策</p>
            </div>

            <form id="loginForm">
                <div class="error-msg" id="errorMsg"></div>

                <div class="input-group">
                    <label class="input-label">政务账号 / ID</label>
                    <div class="input-field-container">
                        <input type="text" id="username" name="username" placeholder="请输入您的账号" autocomplete="off" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 35px;">
                    <label class="input-label">安全密码 / PASSWORD</label>
                    <div class="input-field-container">
                        <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">安全接入</button>

                <div class="extra-links">
                    <a href="javascript:;">忘记密码?</a>
                    <a href="javascript:;" style="color: var(--tech-cyan);">申领新账号</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 背景Canvas动画
        const canvas = document.getElementById('data-canvas-container');
        const ctx = canvas.getContext('2d');

        let w, h;
        let particles = [];
        let particleCount = 120;
        let connectionDistance = 100;
        let speedMultiplier = 0.3;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * speedMultiplier;
                this.vy = (Math.random() - 0.5) * speedMultiplier;
                this.radius = Math.random() * 1.5 + 0.5;
                this.color = Math.random() > 0.9 ? 'rgba(0, 119, 255, 0.8)' : 'rgba(0, 242, 255, 0.8)';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > w) this.vx *= -1;
                if (this.y < 0 || this.y > h) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            particleCount = w > 800 ? 120 : 70;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 242, 255, ${opacity * 0.3})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });
        resizeCanvas();
        initParticles();
        animateCanvas();

        // 登录逻辑
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginWrapper = document.getElementById('loginWrapper');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorMsg.textContent = '请填写完整的账号和密码';
                return;
            }

            errorMsg.textContent = '';
            loginBtn.innerText = '正在安全接入...';
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.code === 0) {
                    // 登录成功动画
                    particles.forEach(p => {
                        p.vx *= 5;
                        p.vy *= 5;
                    });

                    setTimeout(() => {
                        loginWrapper.classList.add('logging-success');
                    }, 500);

                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 1200);
                } else {
                    errorMsg.textContent = data.msg || '用户名或密码不正确';
                    loginBtn.innerText = '安全接入';
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请稍后重试';
                loginBtn.innerText = '安全接入';
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
